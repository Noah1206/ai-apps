[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "busan-speech-research-lab"
version = "0.1.0"
description = "Measurement foundation for the Busan Dialect Tutor Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Busan Dialect Tutor Engine" }]
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
busan-lab = "busan_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/busan_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["busan_lab"]
